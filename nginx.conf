server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The app is fully client-side. These headers make the browser enforce that:
  # no scripts from elsewhere, and no request may leave the page (connect-src 'none').
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-src blob:; object-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # add_header in a location replaces the server-level headers, so repeat them all here.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; frame-src blob:; object-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
